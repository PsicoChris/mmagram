<ion-header lines="none">
  <ion-toolbar style="--background: #1e1e1e;">
    <ion-title style="color: white; font-weight: bold;">MI PROGRESIÓN</ion-title>
    <ion-buttons slot="end">
      <ion-button color="light" (click)="logout()" title="Cerrar Sesión">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content style="--background: #121212; color: white; padding-bottom: 80px;" class="ion-padding">
  <div style="display: flex; align-items: center; margin-bottom: 25px; background: #1e1e1e; padding: 15px; border-radius: 12px;">
    <img [src]="currentUser?.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'" style="width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #ff5722;" alt="Avatar Atleta" />
    <div style="margin-left: 15px;">
      <h2 style="margin: 0; font-weight: bold; font-size: 18px; color: white;">{{ currentUser?.name || 'Chris "La Makina"' }}</h2>
      <p style="margin: 4px 0 0 0; color: #a0a0a0; font-size: 13px;">{{ currentUser?.discipline || 'Atleta de Combate Combinado' }}</p>
    </div>
  </div>

  <h5 style="color: #a0a0a0; font-size: 14px; margin-bottom: 15px; letter-spacing: 0.5px;">GRADOS POR DISCIPLINA</h5>

  <div *ngFor="let r of rangos" style="background: #1e1e1e; padding: 16px; border-radius: 10px; margin-bottom: 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-weight: bold; font-size: 15px; color: white;">{{r.disciplina}}</span>
      <span [style.color]="r.color" style="font-weight: bold; font-size: 13px;">{{r.nivel}}</span>
    </div>
    <div style="color: #a0a0a0; font-size: 12px; margin-bottom: 10px;">{{r.detalle}}</div>
    
    <!-- Barra de progreso analítica -->
    <div style="background: #2b2b2b; height: 8px; border-radius: 4px; width: 100%; overflow: hidden;">
      <div [style.width.%]="r.progreso * 100" [style.background]="r.color" style="height: 100%; border-radius: 4px;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #707070; margin-top: 5px;">
      <span>Nivel Actual</span>
      <span>Siguiente Grado</span>
    </div>
  </div>
</ion-content>

<!-- Componente de la barra inferior mapeado -->
<app-footer-tabs selectedTab="ranges"></app-footer-tabs>
