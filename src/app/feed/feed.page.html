<ion-header>
  <ion-toolbar color="dark">
    <ion-title>OctaStrike Feed</ion-title>
    <ion-buttons slot="end">
      <ion-button color="light" (click)="logout()" title="Cerrar Sesión">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content color="dark" class="ion-padding" style="padding-bottom: 80px;">

  <!-- SECCIÓN DE HISTORIAS / ESTADOS SUPERIORES -->
  <div class="stories-container" style="display: flex; overflow-x: auto; padding: 10px 0; margin-bottom: 10px;">
    <div style="text-align: center; margin-right: 15px; min-width: 70px;">
      <ion-avatar style="width: 55px; height: 55px; border: 2px solid #ff5722; margin: 0 auto 5px auto;">
        <img src="https://ionicframework.com/docs/img/demos/avatar.svg" alt="Tu Estado" />
      </ion-avatar>
      <ion-label style="font-size: 11px; color: #aaa;">Tu Estado</ion-label>
    </div>
    <div style="text-align: center; margin-right: 15px; min-width: 70px;">
      <ion-avatar style="width: 55px; height: 55px; border: 2px solid #ff5722; margin: 0 auto 5px auto;">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=150" alt="Prof. Silva" />
      </ion-avatar>
      <ion-label style="font-size: 11px; color: #aaa;">Prof. Silva</ion-label>
    </div>
  </div>

  <!-- LISTADO DINÁMICO DE TARJETAS DEL FEED -->
  <ion-card *ngFor="let post of posts" color="dark" style="margin: 0 0 20px 0; background: #1e1e1e; border-radius: 12px; border: 1px solid #2a2a2a;">
    <ion-item lines="none" color="none" style="--padding-start: 10px;">
      <ion-avatar slot="start" style="width: 40px; height: 40px;">
        <img [src]="post.avatar" alt="Avatar" />
      </ion-avatar>
      <ion-label style="margin-left: -5px;">
        <h3 style="color: white; font-weight: bold; margin: 0; font-size: 14px;">{{ post.author }}</h3>
        <p style="color: #ff5722; font-size: 11px; font-weight: 600; margin: 2px 0 0 0; letter-spacing: 0.5px;">{{ post.discipline }}</p>
      </ion-label>
      <ion-label slot="end" style="text-align: end;">
        <p style="color: #666; font-size: 11px; margin: 0;">{{ post.time }}</p>
      </ion-label>
    </ion-item>

    <!-- Imagen de la publicación técnica -->
    <img [src]="post.image" style="width: 100%; max-height: 350px; object-fit: cover;" alt="Imagen del post" />

    <ion-card-content style="padding: 12px;">
      <!-- Descripción del Post -->
      <p style="color: #e0e0e0; font-size: 13.5px; line-height: 1.4; margin: 0 0 12px 0;">
        {{ post.description }}
      </p>

      <!-- Panel de Interacciones (Likes y Comentarios) -->
      <div style="display: flex; align-items: center; justify-content: flex-start; gap: 15px; border-top: 1px solid #2a2a2a; padding-top: 10px;">
        <ion-button fill="clear" size="small" (click)="toggleLike(post)" style="--padding-start: 0; --padding-end: 0; margin: 0; height: 24px;">
          <ion-icon [name]="post.liked ? 'heart' : 'heart-outline'" [color]="post.liked ? 'danger' : 'light'" style="font-size: 22px;"></ion-icon>
          <span style="color: #e0e0e0; font-size: 13px; margin-left: 6px; font-weight: bold;">{{ post.likes }}</span>
        </ion-button>

        <ion-button fill="clear" size="small" style="--padding-start: 0; --padding-end: 0; margin: 0; height: 24px;">
          <ion-icon name="chatbubble-outline" color="light" style="font-size: 20px;"></ion-icon>
          <span style="color: #aaa; font-size: 13px; margin-left: 6px;">Comentar</span>
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- BOTÓN FLOTANTE PARA CREAR PUBLICACIÓN -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end" style="margin-bottom: 70px;">
    <ion-fab-button color="danger" (click)="openCreateModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- MODAL EMERGENTE -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeCreateModal()">
    <ng-template>
      <ion-header>
        <ion-toolbar color="dark">
          <ion-title>Nueva Publicación</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeCreateModal()" color="light">Cancelar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content color="dark" class="ion-padding">
        
        <!-- SECTOR MULTIMEDIA: VISTA PREVIA Y BOTÓN DE SUBIDA -->
        <div style="text-align: center; margin-bottom: 20px;">
          <img [src]="previewImage" style="border-radius: 12px; max-height: 200px; width: 100%; object-fit: cover; border: 1px solid #333; margin-bottom: 10px;" alt="Vista previa" />
          
          <input type="file" id="file-upload" accept="image/*" (change)="onFileSelected($event)" style="display: none;" />
          <label for="file-upload" style="background-color: #333; color: white; padding: 8px 16px; border-radius: 6px; display: inline-block; cursor: pointer; font-size: 13px; font-weight: bold; border: 1px solid #555;">
            📁 Seleccionar Foto desde el Dispositivo
          </label>
        </div>

        <!-- Inputs del Formulario -->
        <ion-item fill="outline" mode="md" class="ion-margin-bottom" style="--background: #1e1e1e; --color: white; border-radius: 8px;">
          <ion-label position="floating" style="color: #aaa;">Disciplina (Ej: BJJ, Muay Thai, MMA)</ion-label>
          <ion-input [(ngModel)]="newDisciplina" type="text" style="color: white;"></ion-input>
        </ion-item>

        <ion-item fill="outline" mode="md" class="ion-margin-bottom" style="--background: #1e1e1e; --color: white; border-radius: 8px;">
          <ion-label position="floating" style="color: #aaa;">¿Qué estás entrenando hoy?</ion-label>
          <ion-textarea [(ngModel)]="newDescription" rows="4" style="color: white;"></ion-textarea>
        </ion-item>

        <!-- Botón de Envío -->
        <ion-button expand="block" color="danger" (click)="publicarPost()" [disabled]="!newDescription.trim()" style="margin-top: 20px; font-weight: bold; height: 45px; --border-radius: 8px;">
          Compartir en OctaStrike 🥊
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>

<!-- NAVEGACIÓN GLOBAL POR PESTAÑAS (FOOTER TABS) -->
<app-footer-tabs selectedTab="feed"></app-footer-tabs>
