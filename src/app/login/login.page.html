<ion-content class="ion-padding" style="--background: #121212; color: white;">
  <div class="login-container ion-text-center" style="margin-top: 25%; padding: 0 10px; text-align: center;">
    <div style="font-size: 60px; color: #ff5722; margin-bottom: 5px;">⬢</div>
    <h1 style="color: #ffffff; font-weight: 800; letter-spacing: 2px; margin-bottom: 40px; font-size: 28px;">OCTASTRIKE</h1>

    <ion-item lines="none" style="--background: #1e1e1e; --border-radius: 8px; margin-bottom: 15px; color: white;">
      <ion-input type="email" placeholder="Correo Electrónico" style="color: white;" [(ngModel)]="correo"></ion-input>
    </ion-item>

    <ion-item lines="none" style="--background: #1e1e1e; --border-radius: 8px; margin-bottom: 30px; color: white;">
      <ion-input type="password" placeholder="Contraseña" style="color: white;" [(ngModel)]="contrasena"></ion-input>
    </ion-item>

    <ion-button expand="block" style="--background: #ff5722; font-weight: bold; height: 45px; --border-radius: 8px; color: white;" (click)="ingresar()">
      Iniciar Sesión
    </ion-button>

    <div style="margin-top: 30px; background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px dashed #ff5722;">
      <p style="color: #a0a0a0; font-size: 11px; margin: 0 0 5px 0; font-weight: bold;">🔑 CREDENCIALES DE PRUEBA:</p>
      <p style="color: white; font-size: 12px; margin: 0;">User: chris&#64;octastrike.com</p>
      <p style="color: white; font-size: 12px; margin: 0;">Pass: mma123</p>
    </div>
  </div>
</ion-content>
